# 말씀선포 음성 만들기 — 구글 TTS(Chirp 3 HD)로 말씀을 읽은 음성을 만들어 Firebase(amsong-99f03)에 넣습니다.
# 손으로 누를 때만 실행됩니다: GitHub 저장소 → Actions → '말씀선포 음성 만들기' → Run workflow
#   build  = 관리 → 음성에서 앱에 내놓은 목소리마다 본문별 · 절별 음성 → amsong_audio/{권}/passages/{본문id[@목소리]}(목록) · {…}_{번호}(0 = 본문 주소, 1~ = 절)
#            앱에서 내린 목소리의 음성은 지움 · 세 권 다 만든 목소리만 amsong_config/audio.ready 에 넣어 앱에서 고를 수 있게 함
#            이미 같은 글·목소리·빠르기로 만든 본문은 건너뜀 (본문을 고쳐 올린 뒤 다시 돌리면 바뀐 본문만 새로 만듦)
#   sample = 목소리 시안 6개
# 필요한 비밀값
#   AMSONG_TTS_KEY     = 구글 클라우드 'amsong-tts' 프로젝트의 API 키 (Text-to-Speech 전용)
#   AMSONG_FIREBASE_SA = Firebase(amsong-99f03) 서비스 계정 키 (아침 알림과 같은 것)
# 본문과 음성은 GitHub에 남기지 않고 Firebase에서 읽고 Firebase에만 저장합니다.
name: 말씀선포 음성 만들기

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = 본문 전체 음성 · sample = 목소리 시안 (갈라디아서 2:20) · pausetest = 줄바꿈 쉼 길이 시험 (고린도전서 13:1-3)"
        required: true
        default: "build"
        type: choice
        options: [build, sample, pausetest]
      voice:
        description: "이 목소리만 (비우면 앱에 내놓은 목소리 전부 · 예: Gacrux 또는 Kore,Charon)"
        required: false
        default: ""
      vols:
        description: "만들 권 (예: 1,2,3 또는 3)"
        required: true
        default: "1,2,3"
      only:
        description: "이 본문만 (비우면 전체 · 예: v1s1p6,v3s11p1)"
        required: false
        default: ""
      force:
        description: "이미 만든 본문도 다시 만들기"
        required: true
        default: false
        type: boolean
      rate:
        description: "읽는 빠르기 (1.0 = 보통, 0.9 = 조금 천천히)"
        required: true
        default: "0.95"

permissions:
  contents: read

concurrency:
  group: amsong-tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 음성 만들기
        env:
          FIREBASE_SA: ${{ secrets.AMSONG_FIREBASE_SA }}
          TTS_KEY: ${{ secrets.AMSONG_TTS_KEY }}
          MODE: ${{ inputs.mode }}
          RATE: ${{ inputs.rate }}
          VOLS: ${{ inputs.vols }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
          ONLYV: ${{ inputs.voice }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then echo "비밀값 AMSONG_FIREBASE_SA 가 없어요"; exit 1; fi
          if [ -z "$TTS_KEY" ]; then echo "비밀값 AMSONG_TTS_KEY 가 아직 없어요 (Settings → Secrets and variables → Actions)"; exit 1; fi
          mkdir -p run && cd run
          npm init -y >/dev/null
          npm i --silent --no-audit --no-fund firebase-admin@12 >/dev/null
          cat > tts.mjs <<'JS'
          import admin from "firebase-admin";
          const PROJECT = "amsong-99f03";
          const sa = JSON.parse(process.env.FIREBASE_SA);
          if (sa.project_id !== PROJECT) { console.error("앱 전용 프로젝트(" + PROJECT + ")의 키가 아니라서 멈춰요: " + sa.project_id); process.exit(1); }
          admin.initializeApp({ credential: admin.credential.cert(sa), projectId: PROJECT });
          const db = admin.firestore(), FV = admin.firestore.FieldValue;
          const KEY = process.env.TTS_KEY, MODE = process.env.MODE || "sample";
          const RATE = Math.min(1.3, Math.max(0.7, Number(process.env.RATE) || 0.95));
          const logRef = db.doc("amsong_config/ttsLog");

          async function api(path, body) {
            const url = "https://texttospeech.googleapis.com/v1/" + path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY);
            const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
            return j;
          }
          // "고린도전서 13Ⓐ:1-13" → "고린도전서 13장 1절에서 13절" · "1 Corinthians 13:1-13" → "First Corinthians, chapter 13, verses 1 to 13"
          function sayRef(ref, lang) {
            const m = String(ref).replace(/Ⓐ/g, "").match(/^(.*?)\s*(\d+):(\d+)(?:-(\d+))?$/);
            if (!m) return String(ref).replace(/Ⓐ/g, "");
            if (lang === "en") {
              const book = m[1].replace(/^1 /, "First ").replace(/^2 /, "Second ").replace(/^3 /, "Third ");
              return `${book}, chapter ${m[2]}, ` + (m[4] ? `verses ${m[3]} to ${m[4]}` : `verse ${m[3]}`);
            }
            return `${m[1]} ${m[2]}장 ${m[3]}절` + (m[4] ? `에서 ${m[4]}절` : "");
          }
          // 책의 한 줄 = 한 호흡 (2.6.1): 줄바꿈 자리에 구글 쉼 표시 [pause short] 등을 넣어 한 문장으로 이어 읽되 줄마다 숨을 쉼
          //  - comma = 2.5.1 방식(줄 끝 쉼표) · short / normal / long = 쉼 표시 (amsong_config/audio.pause 로 정함)
          //  - 줄바꿈 글자를 그대로 보내면 엉뚱한 말이 끼어드는 일이 있었음 (2.5.1)
          const clean = (l) => String(l).replace(/Ⓐ/g, "").replace(/[()（）\[\]「」『』〔〕]/g, "").replace(/\s+/g, " ").trim();
          const PTAG = { short: " [pause short] ", normal: " [pause] ", long: " [pause long] " };
          let PAUSE = "comma";
          const sayLines = (lines, pm = PAUSE) => {
            const a = (lines || []).map(clean).filter(Boolean);
            const end = (l) => /[.!?…”’"']$/.test(l) ? l : l.replace(/[,;:]$/, "") + ".";
            if (PTAG[pm]) return a.map((l, i) => i < a.length - 1 ? l : end(l)).join(PTAG[pm]);
            return a.map((l, i) => /[.,!?;:…”’"']$/.test(l) ? l : l + (i < a.length - 1 ? "," : ".")).join(" ");
          };
          const isMarkup = (t) => /\[pause( short| long)?\]/.test(t);
          const verseText = (p, pm) => p.verses.map((v) => sayLines(v.lines, pm)).join(" ");
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          async function speak(voice, text) {
            const body = { input: isMarkup(text) ? { markup: text } : { text }, voice: { languageCode: voice.languageCodes[0], name: voice.name }, audioConfig: { audioEncoding: "MP3", speakingRate: RATE } };
            for (let t = 0; ; t++) {
              try { return await api("text:synthesize", body); }
              catch (e) {
                if (body.input.markup && /markup|pause|invalid/i.test(e.message)) { console.log("쉼 표시를 못 써서 쉼표로: " + e.message); body.input = { text: body.input.markup.replace(/\s*\[pause( short| long)?\]\s*/g, ", ") }; continue; }
                if (/rate|speaking/i.test(e.message) && body.audioConfig.speakingRate) { delete body.audioConfig.speakingRate; continue; } // 빠르기를 못 바꾸는 목소리면 보통 빠르기로
                if (t < 6 && /quota|exhausted|429|50\d|unavailable|deadline|internal|fetch failed/i.test(e.message)) { await sleep(4000 * (t + 1)); continue; } // 잠깐 막히면 쉬었다가 다시
                throw e;
              }
            }
          }
          const LABEL = { Sulafat: "따뜻한 여성", Gacrux: "차분한 여성", Kore: "또렷한 여성", Aoede: "밝은 여성", Leda: "젊은 여성",
            Charon: "차분한 남성", Iapetus: "맑은 남성", Schedar: "고른 남성", Orus: "단단한 남성", Achird: "다정한 남성" };
          const WANT = ["Sulafat", "Gacrux", "Kore", "Charon", "Iapetus", "Schedar"];

          // 목소리별 문서 이름: Gacrux(처음 만든 목소리)는 본문id 그대로, 다른 목소리는 본문id@목소리 (2.6)
          const sfx = (short) => short === "Gacrux" ? "" : "@" + short;
          async function build() {
            const cfg = (await db.doc("amsong_config/audio").get()).data() || {};
            if (!cfg.voice) throw new Error("아직 목소리를 고르지 않았어요 (앱 → 관리 → 음성)");
            const ONLYV = String(process.env.ONLYV || "").split(/[^A-Za-z]+/).filter(Boolean);
            const offeredAll = [...new Set([cfg.voice, ...(cfg.voices || [])].filter(Boolean))];
            const offered = offeredAll.filter((v) => !ONLYV.length || ONLYV.includes(v.split("-").pop()));
            PAUSE = cfg.pause || "comma";
            console.log("줄바꿈 쉼: " + PAUSE + " · 목소리: " + offered.map((v) => v.split("-").pop()).join(", "));
            const VOLS = String(process.env.VOLS || "1,2,3").split(/[^0-9]+/).filter(Boolean);
            const FORCE = String(process.env.FORCE) === "true";
            const ONLY = String(process.env.ONLY || "").split(/[^A-Za-z0-9]+/).filter(Boolean);
            const sigOf = (s) => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
            let made = 0, skipped = 0, parts = 0, chars = 0, bytes = 0;
            const t0 = Date.now();
            const stagesOf = {};
            for (const vol of ["1", "2", "3"]) stagesOf[vol] = (await db.collection("amsong_books/" + vol + "/stages").get()).docs.map((d) => d.data()).sort((a, b) => a.num - b.num);
            const log = (extra) => logRef.set({ last: { mode: MODE, ok: true, at: Date.now(), rate: RATE, pause: PAUSE, voice: cfg.voice, voices: offered.map((v) => v.split("-").pop()), made, skipped, chars, error: "", ...extra } }, { merge: true });

            // 앱에서 내린 목소리는 지워서 저장 공간을 비움
            for (const vol of ["1", "2", "3"]) {
              const sum = (await db.doc("amsong_audio/" + vol).get()).data() || {};
              const gone = Object.keys(sum.voices || {}).filter((sh) => !offeredAll.some((v) => v.endsWith("-" + sh)));
              for (const sh of gone) {
                let n = 0;
                for (const st of stagesOf[vol]) for (const p of st.passages || []) {
                  const ref = db.doc("amsong_audio/" + vol + "/passages/" + p.id + sfx(sh)), d = (await ref.get()).data();
                  if (!d) continue;
                  for (let i = 0; i < (d.count || 0); i++) await db.doc("amsong_audio/" + vol + "/passages/" + p.id + sfx(sh) + "_" + i).delete();
                  await ref.delete(); n++;
                }
                await db.doc("amsong_audio/" + vol).set({ voices: { [sh]: FV.delete() } }, { merge: true });
                console.log("지움: " + vol + "권 · " + sh + " 목소리 본문 " + n + "개");
              }
            }

            for (const voiceKo of offered) {
              const short = voiceKo.split("-").pop();
              const V = { ko: { name: voiceKo, languageCodes: ["ko-KR"] }, en: { name: "en-US-Chirp3-HD-" + short, languageCodes: ["en-US"] } };
              console.log("── 목소리: " + short);
              for (const vol of VOLS) {
                const stages = stagesOf[vol] || [];
                if (!stages.length) { console.log(vol + "권 본문이 없어요 · 건너뜀"); continue; }
                let volN = 0, volBytes = 0;
                for (const st of stages) {
                  const lang = st.lang === "en" ? "en" : "ko", voice = V[lang];
                  for (const p of st.passages || []) {
                    if (ONLY.length && !ONLY.includes(p.id)) continue;
                    const key = p.id + sfx(short);
                    const texts = [sayRef(p.ref, lang) + "."].concat((p.verses || []).map((v) => sayLines(v.lines)));
                    const sig = sigOf(voice.name + "|" + RATE + "|" + texts.join("|"));
                    const idxRef = db.doc("amsong_audio/" + vol + "/passages/" + key);
                    const old = (await idxRef.get()).data();
                    if (!FORCE && old && old.sig === sig) { skipped++; volN++; volBytes += old.bytes || 0; continue; }
                    const info = [];
                    let pb = 0;
                    const one = async (i) => {
                      const r = await speak(voice, texts[i]);
                      const b = Math.round(r.audioContent.length * 0.75);
                      await db.doc("amsong_audio/" + vol + "/passages/" + key + "_" + i).set({ pid: p.id, i, n: i ? p.verses[i - 1].n : 0, sig, b64: r.audioContent, bytes: b });
                      info[i] = { i, n: i ? p.verses[i - 1].n : 0, bytes: b };
                      pb += b; chars += texts[i].length; parts++;
                    };
                    for (let i = 0; i < texts.length; i += 6) await Promise.all(texts.slice(i, i + 6).map((_, k) => one(i + k)));   // 6개씩 함께
                    if (old && old.count > texts.length) for (let i = texts.length; i < old.count; i++) await db.doc("amsong_audio/" + vol + "/passages/" + key + "_" + i).delete();
                    await idxRef.set({ pid: p.id, vol: String(vol), num: st.num, ref: p.ref, lang, voice: voice.name, short, rate: RATE, sig, count: texts.length, parts: info, bytes: pb, at: FV.serverTimestamp() });
                    made++; volN++; volBytes += pb; bytes += pb;
                    console.log("만듦: " + short + " · " + vol + "권 " + st.num + "단계 " + p.ref + " · " + texts.length + "조각 · " + Math.round(pb / 1024) + "KB");
                    if (made % 10 === 0) await log({ running: true, now: short });
                  }
                }
                if (!ONLY.length) await db.doc("amsong_audio/" + vol).set({ vol: String(vol), voice: cfg.voice, rate: RATE, voices: { [short]: { passages: volN, bytes: volBytes, at: Date.now() } }, at: FV.serverTimestamp() }, { merge: true });
              }
              // 세 권 모두 다 만든 목소리만 앱에서 고를 수 있게
              const ready = [];
              for (const v of offeredAll) {
                const sh = v.split("-").pop();
                let ok = true;
                for (const vol of ["1", "2", "3"]) {
                  const total = (stagesOf[vol] || []).reduce((a, st) => a + (st.passages || []).length, 0);
                  if (!total) continue;
                  const sum = (await db.doc("amsong_audio/" + vol).get()).data() || {};
                  const have = (sum.voices && sum.voices[sh] && sum.voices[sh].passages) || (sh === "Gacrux" && sum.passages) || 0;
                  if (have < total) ok = false;
                }
                if (ok) ready.push(sh);
              }
              await db.doc("amsong_config/audio").set({ ready }, { merge: true });
              console.log("앱에서 고를 수 있는 목소리: " + ready.join(", "));
            }
            await log({ running: false, vols: VOLS, parts, bytes, secs: Math.round((Date.now() - t0) / 1000) });
            console.log("본문 음성 완료 · 새로 " + made + "개 · 그대로 " + skipped + "개 · " + chars + "자 · " + Math.round(bytes / 1048576 * 10) / 10 + "MB");
          }

          try {
            if (MODE === "build") { await build(); process.exit(0); }
            const acfg = (await db.doc("amsong_config/audio").get()).data() || {};
            PAUSE = acfg.pause || "comma";
            if (MODE === "pausetest") {
              // 줄바꿈 쉼 길이 시험: 기본 목소리로 고린도전서 13:1-3을 네 가지로 → 관리 → 음성에서 듣고 고르기
              if (!acfg.voice) throw new Error("기본 목소리가 없어요");
              const v = { name: acfg.voice, languageCodes: ["ko-KR"] };
              const st = (await db.doc("amsong_books/1/stages/1").get()).data();
              const p = st && (st.passages || []).find((x) => /^고린도전서 13/.test(x.ref));
              if (!p) throw new Error("1권 1단계에서 고린도전서 13장을 찾지 못했어요");
              const vs = p.verses.slice(0, 3), ref = "고린도전서 13:" + vs[0].n + "-" + vs[vs.length - 1].n;
              const PT = [["comma", "지금 방식 · 줄 끝 쉼표", 1], ["short", "짧게 쉼", 2], ["normal", "보통 쉼", 3], ["long", "길게 쉼", 4]];
              let chars = 0;
              for (const [pm, label, order] of PT) {
                const text = vs.map((x) => sayLines(x.lines, pm)).join(" ");
                const r = await speak(v, text);
                chars += text.length;
                await db.doc("amsong_audio_samples/pt_" + pm).set({ test: true, pause: pm, order, short: "pt_" + pm, label, voice: acfg.voice, ref, rate: RATE, b64: r.audioContent, bytes: Math.round(r.audioContent.length * 0.75), at: FV.serverTimestamp() });
                console.log("만듦: " + label + " · " + Math.round(r.audioContent.length * 0.75 / 1024) + "KB");
              }
              await logRef.set({ last: { mode: MODE, ok: true, at: Date.now(), rate: RATE, chars, error: "" } }, { merge: true });
              console.log("쉼 시험 4개 완료 · 앱 → 관리 → 음성 에서 들어 보세요");
              process.exit(0);
            }
            if (MODE !== "sample") throw new Error("아직 준비 중인 방식이에요: " + MODE);
            const { voices = [] } = await api("voices?languageCode=ko-KR");
            const chirp = voices.filter((v) => /Chirp3-HD/.test(v.name));
            if (!chirp.length) throw new Error("한국어 Chirp 3 HD 목소리를 찾지 못했어요");
            const short = (v) => v.name.split("-").pop();
            let pick = WANT.map((w) => chirp.find((v) => short(v) === w)).filter(Boolean);
            for (const v of chirp) { if (pick.length >= 6) break; if (!pick.includes(v)) pick.push(v); }

            const st = (await db.doc("amsong_books/1/stages/1").get()).data();
            const p = st && (st.passages || []).find((x) => /^갈라디아서 2:20/.test(x.ref));
            if (!p) throw new Error("1권 1단계에서 갈라디아서 2:20을 찾지 못했어요 (본문을 먼저 올려 주세요)");
            const text = sayRef(p.ref, "ko") + ". " + verseText(p);

            const done = [];
            for (const v of pick) {
              const r = await speak(v, text);
              const s = short(v);
              await db.doc("amsong_audio_samples/" + s).set({ voice: v.name, short: s, gender: v.ssmlGender || "", label: LABEL[s] || "",
                ref: p.ref, rate: RATE, b64: r.audioContent, bytes: Math.round(r.audioContent.length * 0.75), at: FV.serverTimestamp() });
              done.push(s); console.log("만듦: " + v.name + " · " + Math.round(r.audioContent.length * 0.75 / 1024) + "KB");
            }
            const old = await db.collection("amsong_audio_samples").get();
            for (const d of old.docs) if (!done.includes(d.id) && !(d.data() || {}).test) await d.ref.delete();
            await logRef.set({ last: { mode: MODE, ok: true, at: Date.now(), rate: RATE, voices: done, chars: text.length * done.length, error: "" } }, { merge: true });
            console.log("목소리 시안 " + done.length + "개 완료 · 앱 → 관리 → 음성 에서 들어 보세요");
          } catch (e) {
            console.error("실패: " + e.message);
            await logRef.set({ last: { mode: MODE, ok: false, at: Date.now(), error: String(e.message).slice(0, 300) } }, { merge: true });
            process.exit(1);
          }
          JS
          node tts.mjs
