<!doctype html>
<html lang="ko" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말씀암송 선포구절</title>
<meta name="theme-color" content="#EFE8D9" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말씀선포">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css">
<script>
  // 저장된 화면 모드를 화면이 그려지기 전에 적용 (깜빡임 방지)
  (function () {
    try {
      var t = localStorage.getItem('amsong.theme') || 'cream';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'cream';
      var bar = { cream: '#EFE8D9', dark: '#132A24', night: '#0C1311', warm: '#E3D5B8', contrast: '#E6E8E6' };
      if (bar[t]) document.getElementById('themeColor').setAttribute('content', bar[t]);
      document.documentElement.setAttribute('data-theme', t);
      var s = localStorage.getItem('amsong.size');
      if (s) document.documentElement.style.setProperty('--fs-scale', Math.min(1, Number(s) || 1));
      if (localStorage.getItem('amsong.stars') !== 'off') document.documentElement.classList.add('stars');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="app" aria-live="polite">
  <div class="boot"><span class="boot-mark"></span><span>말씀암송 선포구절</span></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
